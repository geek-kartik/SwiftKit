disabled_rules:
  - line_length
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - missing_docs
  - closure_spacing
  - redundant_nil_coalescing

included:
  - Sources
  - Tests

excluded:
  - .build
  - Examples

line_length:
  warning: 140
  error: 180

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

reporter: "xcode"
